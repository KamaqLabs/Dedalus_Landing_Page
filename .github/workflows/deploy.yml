name: 🚀 Deploy Angular Landing Page to GitHub Pages

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Angular app (production)
        run: npm run build -- --configuration production --output-path=dist/LandingPage --base-href="/Dedalus_Landing_Page/"

      - name: 🪄 Add 404.html fallback (SPA routing support)
        run: cp dist/LandingPage/index.html dist/LandingPage/404.html

      - name: 🚢 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/LandingPage
          token: ${{ secrets.GITHUB_TOKEN }}
