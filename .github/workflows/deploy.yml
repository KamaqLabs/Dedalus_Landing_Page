name: 🚀 Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - develop  

permissions:
  contents: write 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js (v20.19)
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Angular app (production)
        run: |
          npm run build -- --configuration production --base-href="/Dedalus_Landing_Page/"
          echo "📁 Contenido de dist:"
          ls -R dist

      - name: 📄 Copy index.html to 404.html
        run: cp dist/LandingPage/browser/index.html dist/LandingPage/browser/404.html

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/LandingPage/browser
