            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Nombre</mat-label>
              <input matInput type="text" name="nombre" required />

            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Correo</mat-label>
              <input matInput type="email" name="correo" required />
            </mat-form-field>
          </div>
          <div class="form-row">
            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Empresa</mat-label>
              <input matInput type="text" name="empresa" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Teléfono</mat-label>
              <input matInput type="tel" name="telefono" />
            </mat-form-field>
          </div>
          <mat-form-field appearance="outline" class="form-field full-width">
            <mat-label>Mensaje</mat-label>
            <textarea matInput rows="4" name="mensaje" required></textarea>
          </mat-form-field>
          <div class="form-actions">
            <mat-checkbox required>Acepto la política de privacidad.</mat-checkbox>
            <button mat-raised-button color="primary" type="submit" class="form-btn">
