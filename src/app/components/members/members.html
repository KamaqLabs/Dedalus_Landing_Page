
<section id="miembros" class="members-section">
  <div class="members-header">
    <h2 class="members-title">Miembros del grupo</h2>
    <p class="members-desc">Equipo multidisciplinario detrás de KAMAQLABS y el proyecto Dedalus IoT.</p>
  </div>
  <div class="members-list">
    <div class="members-row">
      <mat-card class="member-card" *ngFor="let member of members.slice(0,3)">
        <div class="member-img-wrap">
          <img [src]="member.img" [alt]="member.name" class="member-img" />
        </div>
        <div class="member-info">
          <div class="member-name">{{ member.name }}</div>
          <div class="member-role">{{ member.role }}</div>
          <div class="member-social">
            <a *ngIf="member.linkedin" [href]="member.linkedin" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer">
              <!-- SVG LinkedIn icon -->
              <svg width="24" height="24" viewBox="0 0 24 24" fill="#1672f7" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-10h3v10zm-1.5-11.268c-.966 0-1.75-.784-1.75-1.75s.784-1.75 1.75-1.75 1.75.784 1.75 1.75-.784 1.75-1.75 1.75zm13.5 11.268h-3v-5.604c0-1.337-.026-3.063-1.868-3.063-1.868 0-2.154 1.459-2.154 2.967v5.7h-3v-10h2.881v1.367h.041c.401-.761 1.379-1.563 2.838-1.563 3.036 0 3.6 2.001 3.6 4.601v5.595z"/>
              </svg>
            </a>
            <a *ngIf="member.github" [href]="member.github" aria-label="GitHub" target="_blank" rel="noopener noreferrer">
              <!-- SVG GitHub icon -->
              <svg width="24" height="24" viewBox="0 0 24 24" fill="#222" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.415-4.042-1.415-.546-1.387-1.333-1.757-1.333-1.757-1.089-.745.083-.729.083-.729 1.205.084 1.84 1.236 1.84 1.236 1.07 1.834 2.809 1.304 3.495.997.108-.775.418-1.305.762-1.605-2.665-.305-5.466-1.334-5.466-5.93 0-1.31.469-2.381 1.236-3.221-.124-.303-.535-1.523.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.873.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.804 5.624-5.475 5.921.43.371.823 1.102.823 2.222 0 1.606-.014 2.898-.014 3.293 0 .322.218.694.825.576 4.765-1.585 8.199-6.082 8.199-11.384 0-6.627-5.373-12-12-12z"/>

          </div>
        </div>
      </mat-card>
    </div>
    <div class="members-row members-row--center">
